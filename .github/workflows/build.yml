name: Build Velune APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -q velune-source.zip

      - name: Add missing locale file
        run: echo "unqualifiedResLocale=en-US" > Velune-1.1.2/app/src/main/res/resources.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build debug APK
        working-directory: Velune-1.1.2
        run: gradle :app:assembleUniversalDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: velune-apk
          path: Velune-1.1.2/app/build/outputs/apk/**/*.apk
